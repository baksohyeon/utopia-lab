# 发布容器镜像到 ghcr.io。没有这个，README 承诺的"一条命令"实际是
# "在自己机器上编译 Rust release + LTO 二十分钟，还得先拉得到 rust/node 基础镜像"。
name: Release

on:
  push:
    tags: ["v*"]
  # 正式打 tag 之前先出一个可部署的镜像用
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.1.0-rc4)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # One job per architecture, each on a runner of that architecture.
  #
  # Building arm64 under QEMU on an amd64 runner was rejected earlier: a Rust
  # release build with LTO takes over an hour emulated. Native arm runners
  # (`ubuntu-24.04-arm`) remove that cost, so both architectures build and
  # smoke-test in parallel at native speed. Each job pushes its image by digest
  # only; the `manifest` job below stitches the digests into one tagged
  # multi-arch image, so `docker pull` picks the right one on Apple Silicon and
  # on x86 servers alike.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io rejects uppercase in the repository path, and a fork owner's
      # login may well contain one. metadata-action lowercases for us in the
      # manifest job, but the digest push below names the image by hand.
      - id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "arch=${PLATFORM#linux/}" >> "$GITHUB_OUTPUT"
        env:
          PLATFORM: ${{ matrix.platform }}

      # 先只 load 到本地跑一遍。"镜像构建成功"证明不了"容器能起来"——
      # glibc 跨发行版不匹配就是构建全绿、启动即死。
      #
      # The cache scope is per platform: the two architectures share nothing
      # in their compiled layers, and one shared scope would have each job
      # evicting the other's cache on every run.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: utopia:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Smoke test — boot it, migrate, register a user
        run: |
          set -euo pipefail
          docker network create smoke
          docker run -d --name pg --network smoke \
            -e POSTGRES_USER=utopia -e POSTGRES_PASSWORD=utopia -e POSTGRES_DB=utopia \
            pgvector/pgvector:pg16
          # 轮询条件一律写进 if：set -e 下 `cmd && break` 在 cmd 失败时会终止整个
          # 脚本，把"还没就绪"变成"构建失败"。
          for _ in $(seq 1 40); do
            if docker exec pg pg_isready -U utopia -d utopia >/dev/null 2>&1; then break; fi
            sleep 2
          done
          # 故意不给 UTOPIA_JWT_SECRET：让这一跑覆盖自动生成那条路径。
          # 下面的注册请求会签发并携带 token，密钥没生成好就过不了。
          docker run -d --name app --network smoke -p 1516:1516 \
            -e UTOPIA_DATABASE_URL=postgres://utopia:utopia@pg:5432/utopia \
            utopia:smoke

          # 必须打 /api/v1/health 并核对 JSON：健康检查挂在 nest("/api/v1") 里，
          # 而镜像带 SPA fallback——请求 /health 会拿到 200 的 index.html，看着像通过。
          ok=""
          for _ in $(seq 1 40); do
            if curl -sf -m 3 http://localhost:1516/api/v1/health -o /tmp/h.json \
               && grep -q '"status":"ok"' /tmp/h.json; then ok=1; break; fi
            sleep 2
          done
          if [ -z "$ok" ]; then echo "::error::container never became healthy"; docker logs app; exit 1; fi

          # 注册一次，把迁移 + argon2 + JWT 签发整条链路真正走一遍
          code=$(curl -s -o /tmp/reg.json -w '%{http_code}' -m 10 \
            -X POST http://localhost:1516/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"smoke@example.com","password":"smoke-password-123","display_name":"Smoke"}')
          if [ "$code" != "200" ]; then
            echo "::error::register returned $code"; cat /tmp/reg.json; docker logs app; exit 1
          fi
          grep -q '"token"' /tmp/reg.json || { echo "::error::no token issued"; cat /tmp/reg.json; exit 1; }
          echo "smoke test passed: healthy, migrated, user registered, token issued"

      # 冒烟通过才发布。缓存已热，这步基本是瞬间完成。
      #
      # Pushed by digest, without a tag: the tags belong to the multi-arch
      # manifest, not to either single-arch image. Tagging here would let a
      # `latest` briefly point at whichever architecture finished first.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.image.outputs.name }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # The digest travels to the manifest job as an empty file named after it.
      # That is the documented docker pattern: an artifact per architecture,
      # `merge-multiple` below collects them into one directory.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.image.outputs.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-architecture digests into one tagged image. This is the
  # only job that writes tags, so `needs: image` also means "no tag moves
  # unless every architecture passed its smoke test".
  manifest:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # **预发布不动 latest。** `{{major}}.{{minor}}` 那两条
            # metadata-action 自己会跳过预发布，而这条 raw 不会——推一个
            # `v0.1.0-rc1` 就把 latest 拖了过去，而那正好是 rc 要避免的事。
            # 判据是 tag 里有没有连字符：semver 用它标预发布
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') }}
            type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${image}@sha256:%s " *)

      # Fails if either platform is missing from the manifest list, which is
      # the whole point of the exercise.
      - name: Verify both architectures are in the manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$image" | tee /tmp/inspect.txt
          for p in linux/amd64 linux/arm64; do
            grep -q "Platform: *$p" /tmp/inspect.txt || { echo "::error::$p missing from $image"; exit 1; }
          done
