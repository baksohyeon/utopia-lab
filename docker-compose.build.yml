# Build from source, layered on top of docker-compose.yml. Use it after changing code, or to run an unreleased version:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml --profile app up -d --build
#
# Ordinary deployments do not need this file; plain docker compose --profile app up -d pulls the prebuilt image.
services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
