services:
  db:
    # If Docker Hub is unreachable, UTOPIA_DB_IMAGE can point at any PG16+ image that ships pgvector
    image: ${UTOPIA_DB_IMAGE:-pgvector/pgvector:pg16}
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: ${UTOPIA_DB_PASSWORD:-utopia}
      POSTGRES_DB: utopia
      # Password for the least-privilege role the application runs as. The role is only
      # created when this is set; unset, the application keeps running as the owner.
      UTOPIA_APP_DB_PASSWORD: ${UTOPIA_APP_DB_PASSWORD:-}
    ports:
      # Stay off 5432 on the host: development machines often have a local Postgres
      # holding that port, and a collision means the container never starts. The people
      # who collide are exactly the ones who cannot use their own Postgres either, since
      # it most likely lacks pgvector. Inside the container it is still 5432 (the Postgres
      # standard, and what the app connects to over the compose network).
      #
      # Loopback only: this mapping exists purely for local development (connecting from
      # the host during cargo run). Binding 0.0.0.0 would put a database with a default
      # password on the public internet.
      - "${UTOPIA_DB_BIND:-127.0.0.1:1517}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Creates the least-privilege role on first initialisation. Deployments whose data
      # directory already exists never run it; create the role once by hand (see the
      # upgrade notes in the README). Privileges are granted by migration 0031, not here.
      - ./docker/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia -d utopia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full deployment: docker compose --profile app up -d
  # Local development starts only db and runs the application with cargo run
  #
  # `image` only, no `build`: with both present, an `up` on a machine without the image
  # would build rather than pull, and the prebuilt image would have been published for
  # nothing. To run from source, layer docker-compose.build.yml on top.
  app:
    # Pinned to a specific published version. **This default is the command the README
    # promises**: point it at a tag that does not exist and the first thing after clone
    # is manifest unknown. So retracting a release means changing this too: 0.1.0 was
    # retracted and this now points at the rc. Change it back to 0.1.0 once that ships
    # (or to latest to follow automatically).
    image: ${UTOPIA_IMAGE:-ghcr.io/deeplethe/utopia:0.1.0-rc4}
    profiles: ["app"]
    environment:
      # Runs as the owner by default. To enable the least-privilege role (business tables
      # read-write, ledger append-only), set both of these in .env; see .env.example. They
      # are written out separately rather than assembled conditionally, because nobody can
      # read that kind of nested substitution, and nobody can debug it when it goes wrong.
      UTOPIA_DATABASE_URL: ${UTOPIA_DATABASE_URL:-postgres://utopia:${UTOPIA_DB_PASSWORD:-utopia}@db:5432/utopia}
      UTOPIA_MIGRATION_URL: ${UTOPIA_MIGRATION_URL:-}
      UTOPIA_BIND_ADDR: 0.0.0.0:1516
      # Left empty: the first start generates one and stores it in deployment_settings.
      # A default here would mean the generation path is never reached, and every
      # deployment would again share one key that everybody knows.
      UTOPIA_JWT_SECRET: ${UTOPIA_JWT_SECRET:-}
      UTOPIA_WEB_DIST: /app/web-dist
      UTOPIA_DATA_DIR: /app/data
      # Connection pool cap. Default 32, aligned with the default worker concurrency. A pool
      # smaller than the concurrency shows up as slow requests, not as an error saying the
      # pool is too small, so remember this when tuning concurrency.
      # Before raising it, check that Postgres's max_connections (default 100) has room.
      UTOPIA_DB_MAX_CONNECTIONS: ${UTOPIA_DB_MAX_CONNECTIONS:-32}
    volumes:
      # Raw files (files/) and the full-text index (index/). Without this mount they are
      # gone the moment the container is recreated, while the documents rows in the
      # database remain: every reference broken, and nothing reports an error.
      # Backup = this directory + the database.
      - ./data:/app/data
    ports:
      - "1516:1516"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
